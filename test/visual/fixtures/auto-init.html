<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixture · auto-init</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #ffffff;
        padding: 16px;
      }
      #wrap {
        width: 640px;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div class="footprint-globe" height="400px" legend="true"></div>
    </div>

    <script>
      window.FOOTPRINT_PINS = {
        residence: [{ name: '2023.10 新加坡', coords: [103.851959, 1.29027] }],
        travel: [{ name: '2019.04 东京', coords: [139.7594549, 35.6828387] }],
      };
      window.__FP_BOUND__ = false;
    </script>

    <script type="importmap">
      {
        "imports": {
          "footprint-globe": "../../../../packages/core/dist/index.js",
          "maplibre-gl": "https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"
        }
      }
    </script>
    <script type="module" src="../../../../packages/web-component/dist/auto.js"></script>
    <script>
      // 等待 auto-init 完成
      setTimeout(() => {
        const el = document.querySelector('.footprint-globe');
        if (el && el.hasAttribute('data-fp-bound')) {
          document.documentElement.setAttribute('data-fp-ready', '1');
        }
      }, 500);
    </script>
  </body>
</html>
