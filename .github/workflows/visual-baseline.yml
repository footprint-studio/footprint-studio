name: Visual Baseline

# 重新生成视觉快照基线（在 CI 比对环境中生成，保证环境一致）。
# 触发方式：
#   1. workflow_dispatch 手动触发；
#   2. 修改 .github/baseline-trigger 哨兵文件并推送到 main。
# 基线有变化时自动提交回 main；随后触发的 CI 将基于新基线校验。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/baseline-trigger']

permissions:
  contents: write

jobs:
  update-baselines:
    name: Regenerate visual baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @footprint-studio/test exec playwright install --with-deps chromium

      - name: Update snapshots
        working-directory: test
        run: pnpm exec playwright test visual --project=chromium --update-snapshots

      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/visual/*-snapshots/
          if git diff --cached --quiet; then
            echo "No baseline changes."
          else
            git commit -m "test: update visual baselines (CI generated)"
            git push
          fi
