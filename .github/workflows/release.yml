name: Release

# 发版模型：CI 通过后直接发版（不使用 Version PR）
# ---------------------------------------------------------------------------
# 背景：GitHub 组织策略可能禁止 Actions 创建 / 审批 PR
# （"GitHub Actions is not permitted to create or approve pull requests"），
# 该开关由组织管理员控制，仓库级设置为只读，且当前 PAT 也没有 pull-request
# 写权限。与其依赖一个可能永远打不开的开关，这里改为：
#
#   1. CI 在 main 上跑绿后触发本工作流（workflow_run）；
#   2. 若有待发 changeset，当场 changeset version → 提交 → 推回 main；
#   3. 立刻 changeset publish（OIDC Trusted Publishing）+ 推 tag。
#
# 版本提交用 GITHUB_TOKEN 推送，GitHub 不会为它再触发工作流，
# 因此不存在自我触发的死循环；下面仍保留一条基于提交信息的兜底判断。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: 版本号维护 + npm 发布
    runs-on: ubuntu-latest
    if: "${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !startsWith(github.event.workflow_run.head_commit.message, 'chore: version packages')) }}"
    permissions:
      contents: write # 需要推送版本提交与 tag
      id-token: write # Trusted Publishing（OIDC）

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run 事件下要显式对齐到被触发那次 CI 的提交
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted Publishing 要求 Node >= 22.14.0 且 npm >= 11.5.1
          node-version: 22
          cache: pnpm
          # 故意不设 registry-url：OIDC 发布不需要 .npmrc / NODE_AUTH_TOKEN，
          # 而 setup-node 生成的 .npmrc 里 always-auth 在 npm 11 会报警告。

      - name: Install
        run: pnpm install --frozen-lockfile

      # CI 已经跑过 lint / 单测 / E2E，这里只需要产物
      - name: Build
        run: pnpm build

      - name: Upgrade npm (>= 11.5.1，Trusted Publishing 硬性要求)
        run: |
          npm install -g npm@latest
          npm --version

      - name: Detect pending changesets
        id: pending
        run: |
          count=$(ls .changeset/*.md 2>/dev/null | grep -v 'README.md' | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "待发 changeset 数量：$count"

      - name: Version and push
        if: steps.pending.outputs.count != '0'
        run: |
          set -euo pipefail
          pnpm exec changeset version
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: version packages'
          git push origin HEAD:main

      # 为什么不用 `changeset publish`：
      # changesets 检测到 pnpm 会执行 `pnpm publish --no-git-checks`，而 pnpm 9 的
      # publish 内部转调 `npm publish` 并把该 pnpm 专属参数一起透传；npm 11 对未知
      # 参数是硬报错（EUNKNOWNCONFIG: Unknown cli flag: --git-checks），而 Trusted
      # Publishing 又强制 npm >= 11.5.1 —— 两边直接冲突。单包结构下直接调 npm 最稳。
      - name: Publish to npm (Trusted Publishing / OIDC)
        id: publish
        working-directory: packages/core
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "::notice::$name@$version 已在 npm 上，跳过发布"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "发布 $name@$version"
          npm publish --provenance --access public
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Tag and push
        if: steps.publish.outputs.published == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          pnpm exec changeset tag
          git push --tags origin
