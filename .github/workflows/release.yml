name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Changesets（Version PR / NPM Publish）
    runs-on: ubuntu-latest
    # 🌟 新增：赋予 OIDC 权限，用于向 npm 证明我们的身份
    permissions:
      contents: write # changesets/action 需要写权限来创建 PR 和打 tag
      pull-requests: write # changesets/action 需要创建 Version PR
      id-token: write # 🌟 核心：用于 Trusted Publishing 获取 OIDC Token

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 🌟 注意：Trusted Publishing 要求 Node >= 22.14.0 且 npm >= 11.5.1
          # 设置 22.x 会自动拉取最新的 22 版本，满足要求
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Trusted Publishing 需要 npm >= 11.5.1（Node 22 自带的 npm 10 不满足）
      - name: Upgrade npm (Trusted Publishing 要求 npm >= 11.5.1)
        run: |
          npm install -g npm@latest
          npm --version

      - uses: changesets/action@v1
        id: changesets
        with:
          # 注意：只能是一条命令。写成 "a && b" 会被当参数拆开传给 changeset CLI，
          # 报 "Too many arguments passed to changesets"。
          # 单包结构下 version 变更不影响 pnpm-lock，无需再跑 install。
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          # 🌟 删除 NPM_TOKEN：走 OIDC Trusted Publishing，无静态密钥

      # changeset publish 只在确实发布了新版本时才有 tag 可推
      - name: Tag published versions
        if: steps.changesets.outputs.published == 'true'
        run: pnpm exec changeset tag
