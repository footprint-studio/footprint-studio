name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Changesets（Version PR / NPM Publish）
    # 流程：
    #   1. 有 pending changeset 时，自动创建/更新 "chore: version packages" PR；
    #   2. 合并该 PR 后自动 changeset publish 发布 npm 并打 tag。
    # 注意：合并 Version PR 前需在 Secrets 配置 NPM_TOKEN（含 publish 权限的
    # automation token），否则 publish 步骤会失败。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets 需要完整历史生成 changelog 与 git tag
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: changesets/action@v1
        with:
          version: pnpm changeset version && pnpm install --no-frozen-lockfile
          # 注意：publish 脚本里不能再用 && 复合命令——action 会原样拆参传给
          # changeset CLI，导致 "Too many arguments" 错误
          publish: pnpm exec changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # 打 git tag：独立步骤执行；无新发布时 changeset tag 为 no-op
      - name: Tag published versions
        run: pnpm exec changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
