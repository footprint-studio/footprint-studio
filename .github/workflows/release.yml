name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Changesets（Version PR / NPM Publish）
    runs-on: ubuntu-latest
    # 🌟 新增：赋予 OIDC 权限，用于向 npm 证明我们的身份
    permissions:
      contents: write # changesets/action 需要写权限来创建 PR 和打 tag
      pull-requests: write # changesets/action 需要创建 Version PR
      id-token: write # 🌟 核心：用于 Trusted Publishing 获取 OIDC Token

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 🌟 注意：Trusted Publishing 要求 Node >= 22.14.0 且 npm >= 11.5.1
          # 设置 22.x 会自动拉取最新的 22 版本，满足要求
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - uses: changesets/action@v1
        with:
          version: pnpm changeset version && pnpm install --no-frozen-lockfile
          publish: pnpm exec changeset publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 🌟 删除了 NPM_TOKEN 和 NODE_AUTH_TOKEN，彻底告别静态密钥

      - name: Tag published versions
        run: pnpm exec changeset tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
