<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>足迹 · Footprint Globe (new API)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="../../packages/core/dist/footprint-globe.css" />
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',

        color: #111827;
        background: #f9fafb;
        -webkit-font-smoothing: antialiased;
      }
      .page {
        max-width: 42rem;
        margin: 0 auto;

      .page-title {

      }
      .page-note a {

      }

        position: relative;
      }

  <body>

      <div class="wrapper">

        基于开源

      </p>

    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
    <script src="./data/pins.js"></script>
