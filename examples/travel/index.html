<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅行博客 · 足迹</title>
    <meta name="description" content="用足迹地球展示旅行足迹的示例。" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        color: #1c1917;
        background: #fefaf6;
        -webkit-font-smoothing: antialiased;
        line-height: 1.6;
      }

      .container {
        max-width: 56rem;
        margin: 0 auto;
        padding: 4rem 1.5rem 3rem;
      }

      .eyebrow {
        font-size: 0.8rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #ea580c;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 800;
        margin: 0 0 0.75rem;
        letter-spacing: -0.02em;
      }

      .lede {
        font-size: 1.1rem;
        color: #57534e;
        margin: 0 0 2.5rem;
        max-width: 40rem;
      }

      .globe-wrap {
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 20px 60px -20px rgba(234, 88, 12, 0.25);
        background: #fff;
      }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        margin-top: 2rem;
      }

      .stat {
        padding: 1rem 1.25rem;
        background: #fff;
        border-radius: 14px;
        border: 1px solid #f5f5f4;
      }

      .stat__value {
        font-size: 1.5rem;
        font-weight: 700;
        color: #ea580c;
      }

      .stat__label {
        font-size: 0.8rem;
        color: #78716c;
        margin-top: 0.1rem;
      }

      footer {
        margin-top: 3rem;
        font-size: 0.85rem;
        color: #a8a29e;
      }

      footer a {
        color: #78716c;
        text-decoration: none;
      }

      footer a:hover {
        color: #ea580c;
      }

      @media (max-width: 640px) {
        h1 {
          font-size: 1.75rem;
        }
        .stats {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <p class="eyebrow">Travel Journal</p>
      <h1>走过的城市</h1>
      <p class="lede">每一次出发都值得记录。下面是我近几年的旅行足迹，鼠标悬停标记可查看地点。</p>

      <div class="globe-wrap">
        <footprint-globe
          id="globe"
          data-src="./data/pins.json"
          height="520px"
          theme="light"
          projection="globe"
          legend="true"
        ></footprint-globe>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat__value">6</div>
          <div class="stat__label">座城市</div>
        </div>
        <div class="stat">
          <div class="stat__value">4</div>
          <div class="stat__label">个国家</div>
        </div>
        <div class="stat">
          <div class="stat__value">2025</div>
          <div class="stat__label">最近一次出发</div>
        </div>
      </div>

      <footer>
        基于 <a href="https://github.com/footprint-studio/footprint-studio">足迹地球</a> · 无 token
        · 数据本地处理
      </footer>
    </main>

    <script type="importmap">
      {
        "imports": {
          "footprint-globe": "../../packages/core/dist/index.js"
        }
      }
    </script>
    <script type="module">
      import { register } from '../../packages/core/dist/index.js';
      register();
    </script>
  </body>
</html>
