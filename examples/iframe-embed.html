<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>足迹地球 · iframe 示例</title>
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB',
          'Microsoft YaHei', sans-serif;
        color: #111827;
        background: #f9fafb;
        padding: 2rem 1rem;
      }
      h1 {
        max-width: 48rem;
        margin: 0 auto 1.5rem;
        font-size: 1.5rem;
      }
      .demo {
        max-width: 48rem;
        margin: 0 auto 1.5rem;
      }
      iframe {
        display: block;
        width: 100%;
        border: 0;
        border-radius: 12px;
        min-height: 200px;
        background: #eef2f7;
      }
    </style>
  </head>
  <body>
    <h1>iframe 示例</h1>

    <div class="demo">
      <iframe
        id="fp"
        src="../../packages/embed/dist/index.html?src=./data/pins.json&theme=light"
        title="我的足迹"
        loading="lazy"
        sandbox="allow-scripts allow-same-origin"
      ></iframe>
    </div>

    <script>
      // 监听 iframe 上报的高度，自适应
      const iframe = document.getElementById('fp');
      window.addEventListener('message', (e) => {
        const data = e.data;
        if (data && data.type === 'footprint:height' && typeof data.height === 'number') {
          iframe.style.height = data.height + 'px';
        }
      });
    </script>
  </body>
</html>
